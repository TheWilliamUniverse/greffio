name: Mobile Artifacts (APK/AAB)

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: false
        default: 'internal'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/patch-well-known.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Patch deep link verification files
        env:
          ANDROID_UPLOAD_KEY_SHA256: ${{ secrets.ANDROID_UPLOAD_KEY_SHA256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/patch-well-known.js

      - name: Inject google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — push FCM disabled for this build"
          fi

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: https://api.greffio.willentreprises.com
          VITE_APP_URL: https://greffio.willentreprises.com
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compute Android version
        run: node scripts/read-android-version.mjs --github-env >> "$GITHUB_ENV"

      - name: Prepare optional signing config
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat > keystore.properties <<EOF
          storeFile=${ANDROID_KEYSTORE_PATH:-release.keystore}
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Release signing configured"
          else
            echo "Android signing secrets missing — unsigned release build"
          fi

      - name: Extract upload key SHA256 (for App Links verification)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SHA=$(keytool -list -v -keystore release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/ {print $2; exit}')
          if [ -n "$SHA" ]; then
            echo "Upload key SHA256: $SHA"
            echo "Add this value to GitHub secret ANDROID_UPLOAD_KEY_SHA256 if not already set"
          fi

      - name: Build APK (release)
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}

      - name: Build AAB (release)
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  upload-google-play:
    if: ${{ github.ref == 'refs/heads/main' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.GOOGLE_PLAY_PACKAGE_NAME != '' }}
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          pattern: app-release-aab-*
          merge-multiple: true
          path: artifacts

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: artifacts/app-release.aab
          track: ${{ github.event.inputs.play_track || secrets.GOOGLE_PLAY_TRACK || 'internal' }}
          status: completed

  tag-release:
    if: github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create timestamp tag
        run: |
          TAG_NAME=mobile-build-$(date +'%Y%m%d-%H%M%S')
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
