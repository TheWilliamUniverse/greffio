name: Backend Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/greffio
            git pull origin main
            npm ci --omit=dev
            npm run db:migrate
            npm run db:check
            pm2 restart greffio-api --update-env
            pm2 save
            curl -f http://127.0.0.1:8787/api/health
            curl -f http://127.0.0.1:8787/api/ready

  secrets-check:
    if: ${{ secrets.VPS_HOST == '' || secrets.VPS_USER == '' || secrets.VPS_SSH_KEY == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Missing required secrets
        run: |
          echo "Missing one or more required GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
          exit 1
