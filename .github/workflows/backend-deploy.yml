name: Backend Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/greffio
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            npm run db:migrate
            npm run db:check
            pm2 restart greffio-api --update-env
            pm2 save
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            curl -fsS http://127.0.0.1:8787/api/health
            curl -fsS http://127.0.0.1:8787/api/ready
            curl -fsS -o /dev/null -w "preview-draft:%{http_code}\n" \
              -X POST http://127.0.0.1:8787/api/statutes/preview-draft \
              -H "Content-Type: application/json" \
              -d '{"data":{"legalForm":"SAS"},"answers":{"denomination":"Test","capitalMontant":"1000","objetSocial":"Commerce","adresseSiege":"1 rue","codePostal":"06200","villeSiege":"Nice","dirigeantPrincipal":"Jean Dupont"}}'

  secrets-check:
    if: ${{ secrets.VPS_HOST == '' || secrets.VPS_USER == '' || secrets.VPS_SSH_KEY == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Missing required secrets
        run: |
          echo "Missing one or more required GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
          exit 1
