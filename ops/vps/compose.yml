name: greffio-infrastructure

services:
  postgres:
    image: postgres:17.10-bookworm
    container_name: greffio-postgres
    restart: unless-stopped
    env_file:
      - .env.infrastructure
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums
      GREFFIO_DB_NAME: ${GREFFIO_DB_NAME}
      GREFFIO_DB_USER: ${GREFFIO_DB_USER}
      GREFFIO_DB_PASSWORD: ${GREFFIO_DB_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_line_prefix=%m [%p] %u@%d %r
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - /srv/greffio/postgres:/var/lib/postgresql/data
      - /srv/greffio/postgres-certs:/etc/postgresql/tls:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=$${POSTGRES_PASSWORD} PGSSLMODE=require psql -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres -Atc 'select 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: greffio-garage
    restart: unless-stopped
    env_file:
      - .env.infrastructure
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      RUST_LOG: garage=info
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - 127.0.0.1:3900:3900
      - 127.0.0.1:3903:3903
    volumes:
      - /srv/greffio/garage/config/garage.toml:/etc/garage.toml:ro
      - /srv/greffio/garage/meta:/var/lib/garage/meta
      - /srv/greffio/garage/data:/var/lib/garage/data
    security_opt:
      - no-new-privileges:true
