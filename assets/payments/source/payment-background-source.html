<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Greffio payment background</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
      }

      body {
        background:
          radial-gradient(circle at 12% 8%, rgba(59, 130, 246, 0.14), transparent 38%),
          radial-gradient(circle at 88% 92%, rgba(30, 77, 140, 0.08), transparent 42%),
          linear-gradient(180deg, #f8fbff 0%, #ffffff 52%, #eef4ff 100%);
      }
    </style>
  </head>
  <body></body>
</html>
